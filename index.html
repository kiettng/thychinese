<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thy Chinese - Học tiếng Trung mỗi ngày</title>
    <!-- Google Fonts: Inter & Noto Sans SC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar (Desktop) -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <i class="fa-solid fa-yin-yang"></i>
                <span>Thy Chinese</span>
            </div>
            
            <nav class="nav-menu">
                <div class="nav-group">
                    <p class="nav-title">CẤP ĐỘ HSK</p>
                    <select id="level-selector" class="level-select">
                        <option value="hsk1">HSK 1</option>
                        <option value="hsk2">HSK 2</option>
                        <option value="hsk3">HSK 3</option>
                        <option value="hsk4">HSK 4</option>
                        <option value="hsk5">HSK 5</option>
                        <option value="hsk6">HSK 6</option>
                    </select>
                </div>

                <!-- Progress Bars -->
                <div class="nav-group progress-group" id="progress-container">
                    <!-- Progress bars injected via JS -->
                </div>

                <div class="nav-group">
                    <p class="nav-title">HỌC TẬP</p>
                    <a href="#" class="nav-item active" data-view="dashboard">
                        <i class="fa-solid fa-house"></i> <span>Trang chủ</span>
                    </a>
                    <a href="#" class="nav-item" data-view="vocabulary">
                        <i class="fa-solid fa-book"></i> <span>Từ vựng</span>
                    </a>
                    <a href="#" class="nav-item" data-view="grammar">
                        <i class="fa-solid fa-pen-nib"></i> <span>Ngữ pháp</span>
                    </a>
                    <a href="#" class="nav-item" data-view="quiz">
                        <i class="fa-solid fa-gamepad"></i> <span>Trắc nghiệm</span>
                    </a>
                </div>

                <div class="nav-group">
                    <p class="nav-title">CÁ NHÂN</p>
                    <a href="#" class="nav-item" data-view="search">
                        <i class="fa-solid fa-magnifying-glass"></i> <span>Tra cứu</span>
                    </a>
                    <a href="#" class="nav-item" data-view="bookmarks">
                        <i class="fa-solid fa-star"></i> <span>Yêu thích</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h1 id="page-title">Trang chủ</h1>
                <div class="user-profile">
                    <div class="streak-badge" id="streak-badge">
                        <i class="fa-solid fa-fire"></i> <span id="streak-count">0</span> ngày
                    </div>
                    <div class="avatar">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
            </header>

            <div class="content-area" id="content-area">
                <!-- Views injected via JS -->
            </div>
        </main>
        
        <!-- Bottom Navigation (Mobile) -->
        <nav class="bottom-nav" id="bottom-nav">
            <a href="#" class="bottom-nav-item active" data-view="dashboard">
                <i class="fa-solid fa-house"></i>
            </a>
            <a href="#" class="bottom-nav-item" data-view="vocabulary">
                <i class="fa-solid fa-book"></i>
            </a>
            <a href="#" class="bottom-nav-item" data-view="quiz">
                <i class="fa-solid fa-gamepad"></i>
            </a>
            <a href="#" class="bottom-nav-item" data-view="search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </a>
            <a href="#" class="bottom-nav-item" data-view="bookmarks">
                <i class="fa-solid fa-star"></i>
            </a>
        </nav>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
